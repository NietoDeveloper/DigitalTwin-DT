# Local only: web on :8080, API on :4100
services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      PORT: "4100"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports: ["4100:4100"]
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]
    restart: unless-stopped
